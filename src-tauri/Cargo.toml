[package]
name = "voiceboard"
version = "26.1.0"
description = "Virtual microphone mixer - Mix real microphone with audio files"
authors = ["Voiceboard Team"]
edition = "2021"
license = "MIT"

[lib]
name = "voiceboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"                # Persistent storage for settings
tauri-plugin-dialog = "2"               # File open dialogs
tauri-plugin-updater = "2"              # Auto-update functionality
tauri-plugin-os = "2"                   # Platform detection
tauri-plugin-process = "2"              # Process control (relaunch)
tauri-plugin-global-shortcut = "2"     # Global keyboard shortcuts
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }  # HTTP client for image search

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio
cpal = "0.15"                    # Cross-platform audio I/O
rodio = "0.19"                   # Audio playback and decoding
hound = "3.5"                    # WAV encoding for normalized sounds
crossbeam-channel = "0.5"        # Lock-free channels for real-time audio
ringbuf = "0.4"                  # Lock-free ring buffer for audio streaming
nnnoiseless = "0.5.2"            # Real-time noise suppression (RNNoise port)

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "process"] }
futures = "0.3"                  # Async utilities (join_all, etc.)

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
regex = "1"                          # URL validation for YouTube import

# VB-Cable installer download & binary manager
reqwest = { version = "0.12", features = ["stream"] }
zip = "2.2"
tar = "0.4"
xz2 = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error tracking
sentry = { version = "0.46", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "logs"] }
sentry-tracing = { version = "0.46", features = ["logs"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[dev-dependencies]
mockall = "0.13"                 # Mocking for tests
tokio-test = "0.4"
rstest = "0.23"                  # Parameterized tests

[features]
default = ["mp3", "ogg", "wav"]
mp3 = []
ogg = []
wav = []
