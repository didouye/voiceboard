name: Backend Release

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-release.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/voiceboard-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CalVer tag
        id: version
        run: echo "tag=$(date -u +'%Y%m%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current stack env
        id: stack
        run: |
          RESPONSE=$(curl -s -X GET \
            "${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.PORTAINER_STACK_ID }}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_ACCESS_TOKEN }}")
          echo "env=$(echo $RESPONSE | jq -c '.Env')" >> $GITHUB_OUTPUT

      - name: Redeploy stack
        run: |
          STACK_FILE=$(cat backend/docker-compose.yml)

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.PORTAINER_STACK_ID }}?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @- <<EOF
          {
            "StackFileContent": $(echo "$STACK_FILE" | jq -Rs .),
            "Env": ${{ steps.stack.outputs.env }},
            "Prune": false,
            "PullImage": true
          }
          EOF
          )

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Portainer API error (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

          echo "Stack redeployed successfully"
